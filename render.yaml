services:
  - type: web
    name: saathi-ai
    env: docker
    plan: free
    region: singapore # or oregon, frankfurt
    dockerfilePath: ./Dockerfile
    envVars:
      - key: ENVIRONMENT
        value: prod
      - key: ALLOW_DEV_TOKENS
        value: "false"
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_API_KEY
        sync: false
